<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
	<div class="container-fluid nav-shell">
		<a class="navbar-brand fw-semibold" routerLink="/home" (click)="closeNav()">Fairport Oktoberfest</a>

		<button
			class="navbar-toggler"
			type="button"
			[attr.aria-expanded]="isNavExpanded"
			aria-controls="baseNavMenu"
			aria-label="Toggle navigation"
			(click)="toggleNav()"
		>
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="baseNavMenu" [class.show]="isNavExpanded">
			<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
				@for (item of navItems; track item.path) {
					<li class="nav-item">
						<a
							class="nav-link"
							[routerLink]="item.path"
							routerLinkActive="active"
							[routerLinkActiveOptions]="{ exact: item.exact }"
							(click)="closeNav()"
						>
							{{ item.label }}
						</a>
					</li>
				}
			</ul>
		</div>
	</div>
</nav>
